name: Conservative quadcopter surface smoothing candidate

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - ".github/workflows/conservative-quadcopter-smoothing-v2.yml"

permissions:
  contents: write

jobs:
  smooth-existing-cad:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout demo only
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Install FreeCAD and mesh processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad python3-numpy python3-pip
          python3 -m pip install --user --disable-pip-version-check --upgrade 'numpy==1.26.4' 'trimesh==4.4.9'

      - name: Export mesh from existing FreeCAD document
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/quadcopter-smooth
          cat > /tmp/quadcopter-smooth/export.FCMacro <<'PY'
          import os, FreeCAD as App, Mesh
          src = os.path.abspath("output/قالب گیری شده/quadcopter_exterior_shell_candidate.FCStd")
          out = "/tmp/quadcopter-smooth/source.stl"
          doc = App.openDocument(src)
          try:
              candidates = []
              for obj in doc.Objects:
                  if hasattr(obj, "Shape") and not obj.Shape.isNull() and len(obj.Shape.Faces) > 100:
                      candidates.append((len(obj.Shape.Faces), obj))
              if not candidates:
                  raise RuntimeError("No substantial existing CAD shape found")
              obj = max(candidates, key=lambda x: x[0])[1]
              Mesh.export([obj], out)
              print("Exported existing object:", obj.Name, "faces:", len(obj.Shape.Faces))
          finally:
              App.closeDocument(doc.Name)
          PY
          if command -v FreeCADCmd >/dev/null 2>&1; then FC=FreeCADCmd; elif command -v freecadcmd >/dev/null 2>&1; then FC=freecadcmd; else echo "FreeCADCmd not found" >&2; exit 1; fi
          env -u LD_LIBRARY_PATH "$FC" /tmp/quadcopter-smooth/export.FCMacro
          test -s /tmp/quadcopter-smooth/source.stl

      - name: Apply very conservative Taubin smoothing and validate deviation
        run: |
          set -euo pipefail
          export PYTHONPATH=/usr/lib/python3/dist-packages
          python3 - <<'PY'
          import json, os
          import numpy as np
          import trimesh
          from trimesh.smoothing import filter_taubin
          src = trimesh.load('/tmp/quadcopter-smooth/source.stl', force='mesh', process=False)
          if not isinstance(src, trimesh.Trimesh) or len(src.faces) < 1000:
              raise RuntimeError("Source STL is missing or unexpectedly small")
          original_vertices = src.vertices.copy()
          original_bounds = src.bounds.copy()
          # Gentle, low-iteration Taubin smoothing: intended to soften visible facet noise
          # while limiting shrinkage. It does not claim to create NURBS surfaces.
          filter_taubin(src, lamb=0.25, nu=0.26, iterations=3)
          displacement = np.linalg.norm(src.vertices - original_vertices, axis=1)
          max_disp = float(displacement.max())
          p95_disp = float(np.percentile(displacement, 95))
          new_extents = src.extents
          extent_delta = np.abs(new_extents - (original_bounds[1]-original_bounds[0]))
          report = {
            "status": "candidate_smoothed",
            "source": "output/قالب گیری شده/quadcopter_exterior_shell_candidate.FCStd",
            "source_files_modified": False,
            "branch_main_modified": False,
            "method": "Taubin mesh smoothing, 3 iterations, lambda=0.25, nu=0.26",
            "source_vertices": int(len(original_vertices)),
            "triangles": int(len(src.faces)),
            "watertight": bool(src.is_watertight),
            "max_vertex_displacement_mm": max_disp,
            "p95_vertex_displacement_mm": p95_disp,
            "extent_change_mm": extent_delta.tolist(),
            "geometry_note": "This is a conservative smoothed mesh candidate, not a reconstructed NURBS/parametric solid. The original model is preserved for comparison.",
            "acceptance": "Reject automatically if the smoothing moves any vertex by more than 1.0 mm or changes any overall extent by more than 0.75 mm."
          }
          if not np.isfinite(src.vertices).all():
              raise RuntimeError("Smoothing produced non-finite vertices")
          if max_disp > 1.0 or float(extent_delta.max()) > 0.75:
              raise RuntimeError("Smoothing exceeded conservative geometry-change limits")
          os.makedirs("output/قالب گیری شده/smoothing", exist_ok=True)
          src.export("output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.stl")
          with open("output/قالب گیری شده/smoothing/smoothing-candidate-report.json", "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Create separate FreeCAD document for smoothed candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/quadcopter-smooth/import.FCMacro <<'PY'
          import os, json, FreeCAD as App, Mesh, Part
          base = os.path.abspath("output/قالب گیری شده/smoothing")
          stl = os.path.join(base, "quadcopter_exterior_shell_smoothed_candidate.stl")
          fcstd = os.path.join(base, "quadcopter_exterior_shell_smoothed_candidate.FCStd")
          step = os.path.join(base, "quadcopter_exterior_shell_smoothed_candidate.step")
          doc = App.newDocument("QuadcopterSmoothedCandidate")
          mesh_obj = doc.addObject("Mesh::Feature", "SmoothedMesh")
          mesh_obj.Label = "Conservatively smoothed mesh candidate (not parametric)"
          mesh_obj.Mesh = Mesh.Mesh(stl)
          doc.recompute()
          # Keep a separate faceted STEP export for CAD interchange; explicitly label its limitation.
          shape = Part.Shape()
          shape.makeShapeFromMesh(mesh_obj.Mesh.Topology, 0.05)
          if shape.isNull() or len(shape.Faces) < 1000:
              raise RuntimeError("Could not create a faceted STEP candidate from smoothed mesh")
          cad_obj = doc.addObject("Part::Feature", "SmoothedFacetedCAD")
          cad_obj.Label = "Smoothed geometry converted to faceted CAD (not NURBS)"
          cad_obj.Shape = shape
          doc.recompute()
          doc.saveAs(fcstd)
          Part.export([cad_obj], step)
          bb = shape.BoundBox
          report = {
            "native_file": os.path.basename(fcstd),
            "step_file": os.path.basename(step),
            "stl_file": os.path.basename(stl),
            "mesh_object_facets": int(mesh_obj.Mesh.CountFacets),
            "step_shape_faces": int(len(shape.Faces)),
            "step_shape_valid": bool(shape.isValid()),
            "step_shape_solids": int(len(shape.Solids)),
            "step_shape_closed": bool(shape.isClosed()),
            "bounds_mm": [bb.XMin, bb.YMin, bb.ZMin, bb.XMax, bb.YMax, bb.ZMax],
            "note": "Smoothing is limited to vertex displacement. The STEP remains faceted; this run does not claim true smooth NURBS surfaces or feature-based parametric reconstruction."
          }
          with open(os.path.join(base, "smoothing-cad-validation.json"), "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          App.closeDocument(doc.Name)
          PY
          if command -v FreeCADCmd >/dev/null 2>&1; then FC=FreeCADCmd; elif command -v freecadcmd >/dev/null 2>&1; then FC=freecadcmd; else echo "FreeCADCmd not found" >&2; exit 1; fi
          env -u LD_LIBRARY_PATH "$FC" /tmp/quadcopter-smooth/import.FCMacro
          test -s "output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.FCStd"
          test -s "output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.step"
          test -s "output/قالب گیری شده/smoothing/smoothing-cad-validation.json"

      - name: Commit only new candidate outputs to demo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.stl" \
            "output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.FCStd" \
            "output/قالب گیری شده/smoothing/quadcopter_exterior_shell_smoothed_candidate.step" \
            "output/قالب گیری شده/smoothing/smoothing-candidate-report.json" \
            "output/قالب گیری شده/smoothing/smoothing-cad-validation.json"
          git commit -m "Add conservative smoothed quadcopter CAD candidate"
          git push origin HEAD:demo
