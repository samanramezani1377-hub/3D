name: Preserve complete original quadcopter STL

on:
  push:
    branches: [demo]
    paths:
      - ".github/workflows/keep-largest-drone-component.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-original-stl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mesh inspection tools
        run: python -m pip install --upgrade pip trimesh numpy scipy
      - name: Download original STL from main
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/samanramezani1377-hub/3D/main/quadcopter_tidy.stl \
            --output /tmp/quadcopter_tidy_original.stl
          test -s /tmp/quadcopter_tidy_original.stl
      - name: Preserve complete model and validate copy
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import trimesh

          src = Path("/tmp/quadcopter_tidy_original.stl")
          out = Path("output/quadcopter_tidy_complete.stl")
          out.parent.mkdir(parents=True, exist_ok=True)
          # Preserve every triangle and every component from the source file.
          # No connected-component filtering or geometry removal is performed.
          shutil.copyfile(src, out)
          mesh = trimesh.load_mesh(out, file_type="stl", process=False)
          if not isinstance(mesh, trimesh.Trimesh) or mesh.is_empty or len(mesh.faces) == 0:
              raise SystemExit("Copied STL is empty or could not be parsed")
          source_hash = hashlib.sha256(src.read_bytes()).hexdigest()
          output_hash = hashlib.sha256(out.read_bytes()).hexdigest()
          if source_hash != output_hash:
              raise SystemExit("Output differs from source; refusing to publish")
          report = {
              "source": "main/quadcopter_tidy.stl",
              "output": "output/quadcopter_tidy_complete.stl",
              "source_bytes": src.stat().st_size,
              "output_bytes": out.stat().st_size,
              "triangle_count": int(len(mesh.faces)),
              "bounds": mesh.bounds.tolist(),
              "sha256_source": source_hash,
              "sha256_output": output_hash,
              "byte_identical_copy": source_hash == output_hash,
              "geometry_removed": False,
              "note": "Complete original model preserved byte-for-byte; no parts removed."
          }
          Path("output/mesh_report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Commit preserved model to demo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/quadcopter_tidy_complete.stl output/mesh_report.json
          git commit -m "Preserve complete original quadcopter STL on demo" || echo "No changes to commit"
          git push origin HEAD:demo
