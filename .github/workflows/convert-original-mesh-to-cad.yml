name: Convert original quadcopter mesh to editable CAD

on:
  # Manual-only: prevent this legacy workflow from running automatically on pushes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: demo


      - name: Cache FreeCAD apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ubuntu-22.04-freecad-apt-v1
          restore-keys: |
            ubuntu-22.04-freecad-apt-

      - name: Set up Python and cache pip downloads
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/convert-original-mesh-to-cad.yml

      - name: Install FreeCAD and mesh inspection tools
        run: |
          # Keep downloaded .deb files so actions/cache can save them after the job.
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/keep-cache
          sudo chmod -R a+rwX /var/cache/apt/archives
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad
          python -m pip install --upgrade 'numpy==1.24.4' 'trimesh<5.2'

      - name: Fetch the original mesh from main (read-only)
        run: |
          mkdir -p build/original-mesh-cad
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/samanramezani1377-hub/3D/main/quadcopter_tidy.obj \
            --output build/original-mesh-cad/quadcopter_tidy.obj
          test -s build/original-mesh-cad/quadcopter_tidy.obj
          sha256sum build/original-mesh-cad/quadcopter_tidy.obj

      - name: Inspect source mesh
        run: |
          python3 - <<'PY'
          import json, trimesh
          p = "build/original-mesh-cad/quadcopter_tidy.obj"
          mesh = trimesh.load(p, force="mesh", process=False)
          report = {
            "source_file": "main/quadcopter_tidy.obj",
            "source_branch_modified": False,
            "vertices": int(len(mesh.vertices)),
            "triangles": int(len(mesh.faces)),
            "bounds_mm": mesh.bounds.tolist(),
            "extents_mm": mesh.extents.tolist(),
            "watertight": bool(mesh.is_watertight),
            "conversion_note": "Mesh-to-CAD conversion preserves the source geometry as a faceted shape; it does not reconstruct smooth analytic surfaces."
          }
          open("build/original-mesh-cad/source-mesh-report.json", "w").write(json.dumps(report, indent=2) + "\\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Convert mesh to FreeCAD document and STEP
        shell: bash
        run: |
          cat > build/original-mesh-cad/convert.FCMacro <<'PY'
          import os, json, traceback
          import FreeCAD as App
          import Mesh
          import Part

          root = os.path.abspath("build/original-mesh-cad")
          src = os.path.join(root, "quadcopter_tidy.obj")
          doc_path = os.path.join(root, "quadcopter_tidy_mesh_cad.FCStd")
          step_path = os.path.join(root, "quadcopter_tidy_mesh_cad.step")
          solid_step_path = os.path.join(root, "quadcopter_tidy_solid_candidate.step")
          report_path = os.path.join(root, "cad-conversion-report.json")

          try:
              mesh_obj = Mesh.Mesh(src)
              if mesh_obj.CountFacets == 0:
                  raise RuntimeError("Imported mesh contains no facets")

              doc = App.newDocument("Qu ad copterMeshCAD".replace(" ", ""))
              mesh_feature = doc.addObject("Mesh::Feature", "OriginalMesh")
              mesh_feature.Label = "Original quadcopter mesh (reference)"
              mesh_feature.Mesh = mesh_obj

              # Create a Part shape from the exact triangular facets.
              # This is editable as a faceted CAD shape, not a smooth NURBS solid.
              shape = Part.Shape()
              shape.makeShapeFromMesh(mesh_obj.Topology, 0.05)
              if shape.isNull():
                  raise RuntimeError("FreeCAD failed to build a shape from the mesh")

              shape_feature = doc.addObject("Part::Feature", "FacetedCAD")
              shape_feature.Label = "Original quadcopter Ã¢ÂÂ faceted CAD conversion"
              shape_feature.Shape = shape
              doc.recompute()

              # Attempt a genuine closed solid from the watertight source shell.
              # Keep the original faceted shape regardless of whether this succeeds.
              solid_feature = None
              solid_status = {"attempted": True, "created": False, "valid": False, "closed": False, "error": None}
              try:
                  shell = Part.Shell(shape.Faces)
                  if not shell.isNull() and shell.isClosed():
                      solid = Part.makeSolid(shell)
                      if not solid.isNull():
                          solid_status["created"] = True
                          solid_status["valid"] = bool(solid.isValid())
                          solid_status["closed"] = bool(solid.isClosed())
                          solid_feature = doc.addObject("Part::Feature", "SolidCandidate")
                          solid_feature.Label = "Solid candidate (mesh-derived; faceted)"
                          solid_feature.Shape = solid
                          # Do NOT call removeSplitter(): it can merge/remove mesh-derived
                          # edges and make vertex-set comparisons misleading. Preserve the
                          # source mesh's faceted topology in the solid candidate.
                          doc.recompute()
                          solid_status["faces_before_export"] = int(len(solid_feature.Shape.Faces))
                          solid_status["refinement_applied"] = False
                          if solid_feature.Shape.isValid() and solid_feature.Shape.isClosed():
                              Part.export([solid_feature], solid_step_path)
                  if not solid_status["created"]:
                      solid_status["error"] = "Mesh-derived shell could not be converted into a closed solid."
              except Exception as exc:
                  solid_status["error"] = str(exc)

              # Export the reference shape and the native document. The original is retained.
              doc.saveAs(doc_path)
              Part.export([shape_feature], step_path)

              bb = shape.BoundBox
              report = {
                  "source": "main/quadcopter_tidy.obj",
                  "source_branch_modified": False,
                  "native_cad": os.path.basename(doc_path),
                  "step_file": os.path.basename(step_path),
                  "mesh_facets": int(mesh_obj.CountFacets),
                  "shape_faces": int(len(shape.Faces)),
                  "shape_is_null": bool(shape.isNull()),
                  "bounds_mm": [bb.XMin, bb.YMin, bb.ZMin, bb.XMax, bb.YMax, bb.ZMax],
                  "extents_mm": [bb.XLength, bb.YLength, bb.ZLength],
                  "geometry_type": "faceted mesh-derived CAD shape",
                  "topology_policy": "preserve source mesh facets; no removeSplitter/refinement applied to the solid candidate",
                  "solid_candidate": solid_status,
                  "solid_candidate_step": os.path.basename(solid_step_path) if os.path.exists(solid_step_path) else None,
                  "limitation": "Mesh conversion alone does not reconstruct design features or smooth analytic surfaces. Even a valid solid candidate remains faceted and is not parametric feature recognition."
              }
              with open(report_path, "w") as f:
                  json.dump(report, f, indent=2)
              print(json.dumps(report, indent=2))
              App.closeDocument(doc.Name)

              # Re-open the saved native CAD file and validate the saved objects.
              validation = {"files": {}, "errors": []}
              reopened = App.openDocument(doc_path)
              try:
                  objects = []
                  shapes = []
                  for obj in reopened.Objects:
                      objects.append({"name": obj.Name, "type": obj.TypeId})
                      if hasattr(obj, "Shape") and not obj.Shape.isNull():
                          s = obj.Shape
                          bb2 = s.BoundBox
                          shapes.append({
                              "name": obj.Name,
                              "valid": bool(s.isValid()),
                              "faces": int(len(s.Faces)),
                              "solids": int(len(s.Solids)),
                              "closed": bool(s.isClosed()),
                              "volume": float(s.Volume),
                              "bounds_mm": [bb2.XLength, bb2.YLength, bb2.ZLength]
                          })
                  validation["files"][os.path.basename(doc_path)] = {
                      "opened": True, "objects": objects, "shapes": shapes
                  }
              finally:
                  App.closeDocument(reopened.Name)

              for path, kind in ((step_path, "faceted STEP"), (solid_step_path, "solid-candidate STEP")):
                  if os.path.isfile(path) and os.path.getsize(path) > 0:
                      validation["files"][os.path.basename(path)] = {
                          "exists": True, "size_bytes": os.path.getsize(path), "type": kind
                      }
                  elif kind == "faceted STEP":
                      validation["errors"].append("Faceted STEP export is missing or empty.")
              with open(os.path.join(root, "validation-report.json"), "w") as f:
                  json.dump(validation, f, indent=2)
              if validation["errors"]:
                  raise RuntimeError("; ".join(validation["errors"]))
          except Exception:
              traceback.print_exc()
              raise
          PY
          # FreeCAD's command-line executable is provided by the Ubuntu package.
          if command -v FreeCADCmd >/dev/null 2>&1; then
            FREECAD_CMD="$(command -v FreeCADCmd)"
          elif command -v freecadcmd >/dev/null 2>&1; then
            FREECAD_CMD="$(command -v freecadcmd)"
          else
            echo "FreeCAD command-line executable not found" >&2
            exit 1
          fi
          # setup-python prepends its runtime libraries to LD_LIBRARY_PATH; FreeCAD 0.19 uses the system Python runtime and can then fail to import stdlib modules (for example math). Run FreeCAD without that injected library path.
          env -u LD_LIBRARY_PATH "$FREECAD_CMD" build/original-mesh-cad/convert.FCMacro
          test -s build/original-mesh-cad/quadcopter_tidy_mesh_cad.FCStd
          test -s build/original-mesh-cad/quadcopter_tidy_mesh_cad.step
          test -s build/original-mesh-cad/cad-conversion-report.json

      - name: Refresh canonical final files on demo
        shell: bash
        run: |
          set -euo pipefail
          DEST="output/original-quadcopter-mesh-cad/downloaded-cad"
          mkdir -p "$DEST"
          cp build/original-mesh-cad/quadcopter_tidy_mesh_cad.FCStd "$DEST/"
          cp build/original-mesh-cad/quadcopter_tidy_mesh_cad.step "$DEST/"
          cp build/original-mesh-cad/source-mesh-report.json "$DEST/"
          cp build/original-mesh-cad/cad-conversion-report.json "$DEST/"
          cp build/original-mesh-cad/validation-report.json "$DEST/"
          if [ -s build/original-mesh-cad/quadcopter_tidy_solid_candidate.step ]; then
            cp build/original-mesh-cad/quadcopter_tidy_solid_candidate.step "$DEST/"
          else
            rm -f "$DEST/quadcopter_tidy_solid_candidate.step"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/quadcopter_tidy_mesh_cad.FCStd" "$DEST/quadcopter_tidy_mesh_cad.step" \
            "$DEST/quadcopter_tidy_solid_candidate.step" "$DEST/source-mesh-report.json" \
            "$DEST/cad-conversion-report.json" "$DEST/validation-report.json"
          if git diff --cached --quiet; then
            echo "Canonical CAD outputs are already up to date."
          else
            git commit -m "Refresh final CAD conversion outputs"
            git push origin HEAD:demo
          fi

      - name: Upload converted CAD files and reports
        uses: actions/upload-artifact@v4
        with:
          name: original-quadcopter-mesh-cad
          path: |
            build/original-mesh-cad/quadcopter_tidy_mesh_cad.FCStd
            build/original-mesh-cad/quadcopter_tidy_mesh_cad.step
            build/original-mesh-cad/quadcopter_tidy_solid_candidate.step
            build/original-mesh-cad/source-mesh-report.json
            build/original-mesh-cad/cad-conversion-report.json
            build/original-mesh-cad/validation-report.json
