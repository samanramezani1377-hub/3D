name: Extract CAD project into demo branch

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - ".github/workflows/commit-cad-artifact.yml"
      - ".github/workflows/trigger-cad-extract.txt"

permissions:
  contents: write

jobs:
  extract-cad-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Extract FreeCAD project and reports from committed archive
        run: |
          set -euo pipefail
          test -s output/original-quadcopter-mesh-cad.zip
          mkdir -p cad/original
          unzip -o output/original-quadcopter-mesh-cad.zip -d /tmp/quadcopter-cad
          find /tmp/quadcopter-cad -maxdepth 3 -type f -printf '%p\n'
          project="$(find /tmp/quadcopter-cad -type f -name 'quadcopter_tidy_mesh_cad.FCStd' -print -quit)"
          test -n "$project"
          cp "$project" cad/original/
          for report in source-mesh-report.json cad-conversion-report.json; do
            found="$(find /tmp/quadcopter-cad -type f -name "$report" -print -quit || true)"
            if [ -n "$found" ]; then cp "$found" cad/original/; fi
          done
          ls -lh cad/original/

      - name: Commit editable FreeCAD project and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add cad/original/
          if git diff --cached --quiet; then
            echo "CAD project and reports are already committed."
          else
            git commit -m "Add editable quadcopter FreeCAD project and reports"
            git push origin HEAD:demo
          fi
