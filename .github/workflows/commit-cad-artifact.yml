name: Extract CAD project into demo branch

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - ".github/workflows/commit-cad-artifact.yml"

permissions:
  contents: write

jobs:
  extract-cad-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Extract FreeCAD project and reports from committed archive
        run: |
          set -euo pipefail
          test -s output/original-quadcopter-mesh-cad.zip
          mkdir -p cad/original
          unzip -o output/original-quadcopter-mesh-cad.zip -d /tmp/quadcopter-cad
          cp /tmp/quadcopter-cad/quadcopter_tidy_mesh_cad.FCStd cad/original/
          cp /tmp/quadcopter-cad/source-mesh-report.json cad/original/
          cp /tmp/quadcopter-cad/cad-conversion-report.json cad/original/
          ls -lh cad/original/

      - name: Commit editable FreeCAD project and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad/original/quadcopter_tidy_mesh_cad.FCStd cad/original/source-mesh-report.json cad/original/cad-conversion-report.json
          if git diff --cached --quiet; then
            echo "CAD project and reports are already committed."
          else
            git commit -m "Add editable quadcopter FreeCAD project and reports"
            git push origin HEAD:demo
          fi
