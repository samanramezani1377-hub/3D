name: Package verified quadcopter CAD outputs

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - '.github/workflows/package-cad-outputs.yml'
      - 'output/original-quadcopter-mesh-cad/downloaded-cad/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: demo

      - name: Verify required CAD deliverables
        shell: bash
        run: |
          set -euo pipefail
          DIR="output/original-quadcopter-mesh-cad/downloaded-cad"
          for file in \
            "quadcopter_tidy_mesh_cad.FCStd" \
            "quadcopter_tidy_mesh_cad.step" \
            "quadcopter_tidy_solid_candidate.step" \
            "source-mesh-report.json" \
            "cad-conversion-report.json" \
            "validation-report.json" \
            "geometry-comparison-report.json"; do
            test -s "$DIR/$file" || { echo "Missing or empty required file: $DIR/$file" >&2; exit 1; }
          done
          python3 - <<'PY'
          import json, pathlib
          d = pathlib.Path("output/original-quadcopter-mesh-cad/downloaded-cad")
          for name in ("source-mesh-report.json", "cad-conversion-report.json", "validation-report.json", "geometry-comparison-report.json"):
              with (d / name).open() as f:
                  json.load(f)
              print("Valid JSON:", name)
          report = json.loads((d / "geometry-comparison-report.json").read_text())
          assert not report.get("errors"), f"Geometry report contains errors: {report['errors']}"
          for name in ("quadcopter_tidy_mesh_cad.step", "quadcopter_tidy_solid_candidate.step"):
              assert report["files"][name]["valid"], f"STEP reported invalid: {name}"
          assert report["files"]["quadcopter_tidy_solid_candidate.step"]["solids"] >= 1, "Solid candidate has no solid"
          print("Required CAD files and reports passed checks.")
          PY

      - name: Create package, checksum manifest, and README
        shell: bash
        run: |
          set -euo pipefail
          SRC="output/original-quadcopter-mesh-cad/downloaded-cad"
          mkdir -p dist/quadcopter-cad
          cp "$SRC/quadcopter_tidy_mesh_cad.FCStd" "$SRC/quadcopter_tidy_mesh_cad.step" "$SRC/quadcopter_tidy_solid_candidate.step" dist/quadcopter-cad/
          cp "$SRC/"*.json dist/quadcopter-cad/
          cat > dist/quadcopter-cad/README.txt <<'EOF'
          Quadcopter CAD conversion package
          Source mesh: main/quadcopter_tidy.obj (read-only; source branch unchanged)
          Files:
          - quadcopter_tidy_mesh_cad.FCStd: native FreeCAD document
          - quadcopter_tidy_mesh_cad.step: faceted CAD shape; closed shell, not a solid
          - quadcopter_tidy_solid_candidate.step: valid closed mesh-derived solid candidate
          - JSON files: source, conversion, validation, and geometry comparison reports
          
          Important limitation:
          The geometry is faceted and derived from the source triangle mesh. This package does not contain reconstructed smooth analytic/NURBS surfaces or parametric design features.
          EOF
          (cd dist && sha256sum quadcopter-cad/* > SHA256SUMS.txt)
          (cd dist && zip -qr quadcopter-cad-package.zip quadcopter-cad SHA256SUMS.txt)
          ls -lh dist/quadcopter-cad-package.zip dist/SHA256SUMS.txt
          unzip -t dist/quadcopter-cad-package.zip

      - name: Upload ready-to-download ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: quadcopter-cad-package
          path: |
            dist/quadcopter-cad-package.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
