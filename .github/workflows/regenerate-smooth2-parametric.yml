name: Regenerate smooth2 parametric quadcopter

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - "cad/parametric/drone_parametric.py"

permissions:
  contents: write

concurrency:
  group: regenerate-smooth2-parametric-demo
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CAD generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy trimesh

      - name: Generate the parametric model
        run: |
          set -euo pipefail
          test -s "cad/parametric/drone_parametric.py"
          test -s "cad/parametric/body_sections.json"
          python "cad/parametric/drone_parametric.py"

      - name: Validate generated files
        run: |
          set -euo pipefail
          out="output/قالب گیری شده/smooth2-parametric"
          python - <<'PY'
          import json, os
          out = "output/قالب گیری شده/smooth2-parametric"
          expected = ["drone_parametric.step", "drone_parametric.stl",
                      "drone_parametric.params.json", "assembly-manifest.json", "validation-report.json"]
          for prefix in ("body_lower", "body_crown", "arm_1", "arm_2", "arm_3", "arm_4",
                         "prop_1", "prop_2", "prop_3", "prop_4"):
              expected.extend([prefix + ".step", prefix + ".stl"])
          for name in expected:
              path = os.path.join(out, name)
              if not os.path.isfile(path) or os.path.getsize(path) < 100:
                  raise SystemExit(f"Missing or unexpectedly small output: {path}")
              print(f"{name}: {os.path.getsize(path)} bytes")
          with open(os.path.join(out, "assembly-manifest.json"), encoding="utf-8") as f:
              manifest = json.load(f)
          if len(manifest.get("parts", [])) != 10:
              raise SystemExit("Assembly manifest should list lower body, crown, four arm modules and four props")
          names = {p.get("name") for p in manifest.get("parts", [])}
          if not {"body_lower", "body_crown"}.issubset(names):
              raise SystemExit("Assembly manifest must contain separate body_lower and body_crown components")
          orientation = manifest.get("export_orientation", {})
          if orientation.get("vertical_axis") != "+Z" or orientation.get("camera_front_direction") != "-Y" or orientation.get("flat_underside_direction") != "-Z":
              raise SystemExit("Export orientation metadata does not match the approved Z-up convention")
          with open(os.path.join(out, "validation-report.json"), encoding="utf-8") as f:
              report = json.load(f)
          bbox = report.get("assembly", {}).get("bbox_mm", [])
          if len(bbox) != 3 or not (bbox[2] < bbox[0] * 0.25 and bbox[2] < bbox[1] * 0.25):
              raise SystemExit(f"Expected Z-up footprint with thin vertical extent; got bbox_mm={bbox}")
          print(f"Verified Z-up assembly bbox_mm={bbox}")
          PY

      - name: Commit exports onto the latest demo branch safely
        shell: bash
        run: |
          set -euo pipefail
          out="output/قالب گیری شده/smooth2-parametric"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          files=(
            "drone_parametric.step"
            "drone_parametric.stl"
            "drone_parametric.params.json"
            "assembly-manifest.json"
            "validation-report.json"
            "body_lower.step" "body_lower.stl"
            "body_crown.step" "body_crown.stl"
            "arm_1.step" "arm_1.stl"
            "arm_2.step" "arm_2.stl"
            "arm_3.step" "arm_3.stl"
            "arm_4.step" "arm_4.stl"
            "prop_1.step" "prop_1.stl"
            "prop_2.step" "prop_2.stl"
            "prop_3.step" "prop_3.stl"
            "prop_4.step" "prop_4.stl"
          )
          # Preserve the generated artifacts while synchronizing with any newer
          # commits that arrived on demo during the CAD build.
          for f in "${files[@]}"; do
            cp "$out/$f" "$tmpdir/$f"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5: syncing with latest origin/demo"
            git fetch origin demo
            git reset --hard origin/demo
            mkdir -p "$out"
            for f in "${files[@]}"; do
              cp "$tmpdir/$f" "$out/$f"
            done

            git add -- \
              "$out/drone_parametric.step" \
              "$out/drone_parametric.stl" \
              "$out/drone_parametric.params.json" \
              "$out/assembly-manifest.json" \
              "$out/validation-report.json" \
              "$out/body_lower.step" "$out/body_lower.stl" \
              "$out/body_crown.step" "$out/body_crown.stl" \
              "$out/arm_1.step" "$out/arm_1.stl" \
              "$out/arm_2.step" "$out/arm_2.stl" \
              "$out/arm_3.step" "$out/arm_3.stl" \
              "$out/arm_4.step" "$out/arm_4.stl" \
              "$out/prop_1.step" "$out/prop_1.stl" \
              "$out/prop_2.step" "$out/prop_2.stl" \
              "$out/prop_3.step" "$out/prop_3.stl" \
              "$out/prop_4.step" "$out/prop_4.stl"
            # Remove obsolete unsplit body exports; keep only the two current body parts.
            git rm -f --ignore-unmatch "$out/body.step" "$out/body.stl"

            if git diff --cached --quiet; then
              echo "Generated CAD exports already match origin/demo; nothing to commit."
              exit 0
            fi

            git commit -m "Regenerate smooth2 parametric quadcopter CAD exports"
            if git push origin HEAD:demo; then
              echo "CAD exports pushed successfully."
              exit 0
            fi
            echo "Push was rejected (likely a concurrent update); retrying against latest demo."
            sleep "$attempt"
          done

          echo "Could not push after 5 attempts; inspect concurrent updates or permissions."
          exit 1
