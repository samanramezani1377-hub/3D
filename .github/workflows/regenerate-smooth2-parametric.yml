name: Build and validate smooth2 parametric CAD (kilo)

on:
  workflow_dispatch:
  push:
    branches:
      - kilo
    paths:
      - "cad/parametric/drone_parametric.py"
      - "cad/parametric/body_sections.json"
      - ".github/workflows/regenerate-smooth2-parametric.yml"

permissions:
  contents: write

concurrency:
  group: smooth2-parametric-kilo
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/kilo'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout kilo
        uses: actions/checkout@v4
        with:
          ref: kilo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery numpy trimesh

      - name: Generate smooth2 CAD from the single source
        shell: bash
        run: |
          set -euo pipefail
          test -s "cad/parametric/drone_parametric.py"
          test -s "cad/parametric/body_sections.json"
          python "cad/parametric/drone_parametric.py"

      - name: Validate the generated package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output/smooth2-parametric")
          parts = (
              ["body_lower", "body_crown"]
              + [f"arm_{i}" for i in range(1, 5)]
              + [f"prop_{i}" for i in range(1, 5)]
              + [f"screw_{i}" for i in range(1, 9)]
              + [f"nut_{i}" for i in range(1, 9)]
          )
          expected = [
              "drone_parametric.step",
              "drone_parametric.stl",
              "drone_parametric_assembled.stl",
              "drone_parametric_exploded.stl",
              "drone_parametric.params.json",
              "assembly-manifest.json",
              "validation-report.json",
          ]
          for part in parts:
              expected.extend([f"{part}.step", f"{part}.stl"])

          for name in expected:
              path = out / name
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f"Missing or unexpectedly small generated file: {path}")

          manifest = json.loads((out / "assembly-manifest.json").read_text(encoding="utf-8"))
          report = json.loads((out / "validation-report.json").read_text(encoding="utf-8"))
          params = json.loads((out / "drone_parametric.params.json").read_text(encoding="utf-8"))

          if manifest.get("branch_scope") != "kilo" or report.get("branch") != "kilo":
              raise SystemExit("Generated metadata must identify the kilo branch")
          if len(manifest.get("parts", [])) != 26 or report.get("assembly", {}).get("solid_count") != 26:
              raise SystemExit("The current assembly must contain exactly 26 solids/components")

          joint = manifest.get("joint", {})
          if joint.get("fastener_count") != 8 or joint.get("side_wall_fasteners") is not False:
              raise SystemExit("Expected eight vertical floor fasteners and no side-wall fasteners")
          if joint.get("floor_bolt_clearance_bores_pass_through") is not True:
              raise SystemExit("The floor bolt bores must pass through the floor plate")
          if joint.get("nut_recesses_open_on_exterior_underside") is not True:
              raise SystemExit("Underside nut pockets are missing")
          if joint.get("nut_seated_inside_floor_recess") is not True:
              raise SystemExit("Nut seating metadata is invalid")

          tick = joint.get("tick_root_geometry", {})
          if tick.get("included_angle_deg") != 110.0:
              raise SystemExit(f"Unexpected tick-root included angle: {tick.get('included_angle_deg')}")
          if abs(tick.get("junction_radius_model_units", -1) - params.get("joint_tick_junction_radius", -2)) > 1e-8:
              raise SystemExit("Tick-root radius does not match the parameter snapshot")

          floor = report.get("floor_plate", {})
          if floor.get("sample_points_checked") != 25 or floor.get("sample_points_retaining_nominal_thickness") != 25:
              raise SystemExit("The 5x5 central floor-thickness sampling did not pass")

          collisions = report.get("propeller_clearance", {}).get("collision_checks", [])
          if len(collisions) != 4 or any(
              not all(check.get(key) is True for key in (
                  "motor_clearance_pass", "arm_clearance_pass",
                  "guard_clearance_pass", "guard_vertical_coverage_pass"
              ))
              for check in collisions
          ):
              raise SystemExit("One or more propeller clearance checks failed")

          for check_name, expected_count in (("stl_watertight", 29), ("step_round_trip_import", 27)):
              check = report.get(check_name, {})
              if check.get("all_passed") is not True:
                  raise SystemExit(f"{check_name} did not pass for every export")
              if len(check.get("files", {})) != expected_count:
                  raise SystemExit(f"{check_name} does not contain {expected_count} per-file checks")

          print(f"Validated {len(expected)} generated files")
          print("Assembly bbox (mm):", report["assembly"]["bbox_mm"])
          print("STL watertight checks:", len(report["stl_watertight"]["files"]))
          print("STEP round-trip checks:", len(report["step_round_trip_import"]["files"]))
          PY

      - name: Commit generated exports to kilo only
        shell: bash
        run: |
          set -euo pipefail
          out="output/smooth2-parametric"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          files=(
            "drone_parametric.step"
            "drone_parametric.stl"
            "drone_parametric_assembled.stl"
            "drone_parametric_exploded.stl"
            "drone_parametric.params.json"
            "assembly-manifest.json"
            "validation-report.json"
            "body_lower.step" "body_lower.stl"
            "body_crown.step" "body_crown.stl"
            "arm_1.step" "arm_1.stl"
            "arm_2.step" "arm_2.stl"
            "arm_3.step" "arm_3.stl"
            "arm_4.step" "arm_4.stl"
            "prop_1.step" "prop_1.stl"
            "prop_2.step" "prop_2.stl"
            "prop_3.step" "prop_3.stl"
            "prop_4.step" "prop_4.stl"
            "screw_1.step" "screw_1.stl"
            "screw_2.step" "screw_2.stl"
            "screw_3.step" "screw_3.stl"
            "screw_4.step" "screw_4.stl"
            "screw_5.step" "screw_5.stl"
            "screw_6.step" "screw_6.stl"
            "screw_7.step" "screw_7.stl"
            "screw_8.step" "screw_8.stl"
            "nut_1.step" "nut_1.stl"
            "nut_2.step" "nut_2.stl"
            "nut_3.step" "nut_3.stl"
            "nut_4.step" "nut_4.stl"
            "nut_5.step" "nut_5.stl"
            "nut_6.step" "nut_6.stl"
            "nut_7.step" "nut_7.stl"
            "nut_8.step" "nut_8.stl"
          )

          for file in "${files[@]}"; do
            cp "$out/$file" "$tmpdir/$file"
          done

          built_sha="$(git rev-parse HEAD)"
          git fetch origin kilo
          latest_sha="$(git rev-parse origin/kilo)"
          if [[ "$latest_sha" != "$built_sha" ]]; then
            echo "kilo changed during CAD generation; refusing to publish stale artifacts."
            echo "Rerun this workflow against the latest kilo commit."
            exit 1
          fi

          git reset --hard origin/kilo
          for file in "${files[@]}"; do
            cp "$tmpdir/$file" "$out/$file"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${out}"
          if git diff --cached --quiet; then
            echo "Generated smooth2 outputs already match kilo."
            exit 0
          fi

          git commit -m "Regenerate and validate smooth2 parametric CAD (kilo)"
          git push origin HEAD:kilo
