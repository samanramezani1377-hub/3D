name: Inspect original quadcopter geometry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          ref: demo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mesh tools
        run: python -m pip install trimesh numpy scipy
      - name: Download source geometry from main without modifying it
        run: |
          mkdir -p inspection
          curl --fail --location --retry 3 https://raw.githubusercontent.com/samanramezani1377-hub/3D/main/quadcopter_tidy.obj -o /tmp/quadcopter_tidy.obj
          curl --fail --location --retry 3 https://raw.githubusercontent.com/samanramezani1377-hub/3D/main/quadcopter_tidy.stl -o /tmp/quadcopter_tidy.stl
          test -s /tmp/quadcopter_tidy.obj
          test -s /tmp/quadcopter_tidy.stl
      - name: Analyze geometry and existing separate parts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import trimesh

          def inspect(path):
              mesh = trimesh.load(path, force="mesh", process=False)
              if mesh.is_empty or len(mesh.faces) == 0:
                  raise RuntimeError(f"Empty or unreadable mesh: {path}")
              return {
                  "file": Path(path).name,
                  "bytes": Path(path).stat().st_size,
                  "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                  "vertices": int(len(mesh.vertices)),
                  "triangles": int(len(mesh.faces)),
                  "bounds": mesh.bounds.tolist(),
                  "extents": mesh.extents.tolist(),
                  "watertight": bool(mesh.is_watertight),
                  "connected_components": int(len(mesh.split(only_watertight=False))),
              }

          report = {
              "purpose": "Read-only inspection; no source geometry is removed or rewritten.",
              "original_obj": inspect("/tmp/quadcopter_tidy.obj"),
              "original_stl": inspect("/tmp/quadcopter_tidy.stl"),
              "existing_parts": []
          }
          for p in sorted(Path("parts").glob("*.stl")):
              report["existing_parts"].append(inspect(str(p)))
          Path("inspection/original_geometry_report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: original-quadcopter-geometry-report
          path: inspection/original_geometry_report.json
