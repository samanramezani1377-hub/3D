name: Inspect existing quadcopter shell before splitting

on:
  workflow_dispatch:
  push:
    branches:
      - demo
    paths:
      - ".github/workflows/inspect-quadcopter-for-splitting.yml"

permissions:
  contents: write

jobs:
  inspect-existing-cad:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout demo only
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Install FreeCAD and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad python3-matplotlib python3-numpy

      - name: Export a diagnostic mesh from the exact existing FCStd
        shell: bash
        run: |
          set -euo pipefail
          DIR="output/قالب گیری شده"
          SRC="$DIR/quadcopter_exterior_shell_candidate.FCStd"
          test -s "$SRC"
          mkdir -p /tmp/cad-inspect
          cat > /tmp/cad-inspect/export.FCMacro <<'PY'
          import os, json, traceback
          import FreeCAD as App
          import Mesh
          root = os.path.abspath("output/قالب گیری شده")
          src = os.path.join(root, "quadcopter_exterior_shell_candidate.FCStd")
          out = "/tmp/cad-inspect/existing_shell_diagnostic.stl"
          report = os.path.join(root, "split-preflight-report.json")
          doc = None
          try:
              doc = App.openDocument(src)
              infos = []
              candidates = []
              for obj in doc.Objects:
                  if hasattr(obj, "Shape") and not obj.Shape.isNull():
                      shape = obj.Shape
                      bb = shape.BoundBox
                      infos.append({
                          "name": obj.Name, "label": obj.Label, "type": obj.TypeId,
                          "valid": bool(shape.isValid()), "closed": bool(shape.isClosed()),
                          "faces": len(shape.Faces), "solids": len(shape.Solids),
                          "shells": len(shape.Shells), "volume_mm3": float(shape.Volume),
                          "bounds_mm": [bb.XMin, bb.YMin, bb.ZMin, bb.XMax, bb.YMax, bb.ZMax],
                          "extents_mm": [bb.XLength, bb.YLength, bb.ZLength]
                      })
                      if len(shape.Faces) > 100:
                          candidates.append((len(shape.Faces), obj))
              if not candidates:
                  raise RuntimeError("No substantial Shape object found in existing FCStd.")
              obj = max(candidates, key=lambda x:x[0])[1]
              Mesh.export([obj], out)
              data = {
                  "status": "preflight_exported_existing_file",
                  "input": "output/قالب گیری شده/quadcopter_exterior_shell_candidate.FCStd",
                  "source_regenerated": False,
                  "main_modified": False,
                  "objects": infos,
                  "selected_mesh_object": obj.Name,
                  "diagnostic_mesh": "existing_shell_diagnostic.stl",
                  "coordinate_note": "Bounding box suggests the long vertical dimension is Z and the thin dimension is Y; coordinate interpretation must be checked against the projected views before defining cuts.",
                  "splitting_policy": "No geometry was cut in this preflight step. The split operation must be based on visible arm roots and guard rings, not arbitrary quadrants."
              }
              with open(report, "w") as f: json.dump(data, f, indent=2)
              print(json.dumps(data, indent=2))
          except Exception:
              traceback.print_exc()
              raise
          finally:
              if doc:
                  App.closeDocument(doc.Name)
          PY
          if command -v FreeCADCmd >/dev/null 2>&1; then FC=FreeCADCmd; elif command -v freecadcmd >/dev/null 2>&1; then FC=freecadcmd; else echo "FreeCADCmd not found" >&2; exit 1; fi
          env -u LD_LIBRARY_PATH "$FC" /tmp/cad-inspect/export.FCMacro
          test -s /tmp/cad-inspect/existing_shell_diagnostic.stl
          test -s "$DIR/split-preflight-report.json"

      - name: Generate orthographic diagnostic views
        run: |
          set -euo pipefail
          export MPLBACKEND=Agg
          python3 - <<'PY'
          import json, os, struct
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from mpl_toolkits.mplot3d.art3d import Poly3DCollection
          base = "output/قالب گیری شده"
          stl_path = "/tmp/cad-inspect/existing_shell_diagnostic.stl"
          with open(stl_path, "rb") as f:
              raw = f.read()
          # FreeCAD exports binary STL here: 80-byte header, uint32 count, then 50-byte facets.
          if len(raw) < 84:
              raise RuntimeError("Diagnostic STL is truncated")
          n = struct.unpack_from("<I", raw, 80)[0]
          if len(raw) != 84 + n * 50:
              raise RuntimeError("Expected binary STL; byte count does not match facet count")
          triangles = np.empty((n, 3, 3), dtype=np.float32)
          off = 84
          for i in range(n):
              triangles[i] = np.frombuffer(raw, dtype="<f4", count=9, offset=off+12).reshape(3,3)
              off += 50
          if n == 0:
              raise RuntimeError("Diagnostic STL contains no facets")
          vertices = triangles.reshape(-1, 3)
          bounds = np.array([vertices.min(axis=0), vertices.max(axis=0)])
          extents = bounds[1] - bounds[0]
          # Render three orthographic views with equal aspect; axes are kept explicit.
          views = [
              ("view_top_XZ.png", (90, -90), "Top / X-Z projection"),
              ("view_front_XY.png", (0, -90), "Front / X-Y projection"),
              ("view_side_YZ.png", (0, 0), "Side / Y-Z projection"),
          ]
          faces = triangles
          # Deterministically sample faces for a responsive diagnostic image only.
          if len(faces) > 18000:
              idx = np.linspace(0, len(faces)-1, 18000, dtype=int)
              faces = faces[idx]
          for name, (elev, azim), title in views:
              fig = plt.figure(figsize=(10, 8))
              ax = fig.add_subplot(111, projection="3d")
              ax.add_collection3d(Poly3DCollection(faces, linewidths=0.02, alpha=0.95))
              center = bounds.mean(axis=0)
              radius = max(extents) / 2
              ax.set_xlim(center[0]-radius, center[0]+radius)
              ax.set_ylim(center[1]-radius, center[1]+radius)
              ax.set_zlim(center[2]-radius, center[2]+radius)
              ax.set_box_aspect((1,1,1))
              ax.view_init(elev=elev, azim=azim)
              ax.set_xlabel("X (mm)"); ax.set_ylabel("Y (mm)"); ax.set_zlabel("Z (mm)")
              ax.set_title(title)
              fig.tight_layout()
              fig.savefig(os.path.join(base, name), dpi=120)
              plt.close(fig)
          print("Mesh bounds:", bounds.tolist())
          print("Extents:", extents.tolist(), "facets:", n)
          PY

      - name: Commit diagnostic preflight only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/قالب گیری شده/split-preflight-report.json" "output/قالب گیری شده/view_top_XZ.png" "output/قالب گیری شده/view_front_XY.png" "output/قالب گیری شده/view_side_YZ.png"
          git commit -m "Inspect existing quadcopter shell before precise part separation"
          git push origin HEAD:demo
