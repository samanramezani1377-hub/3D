name: Validate extracted CAD files

on:
  workflow_dispatch:
  push:
    branches: [demo]
    paths:
      - '.github/workflows/validate-extracted-cad.yml'

permissions:
  contents: write

jobs:
  validate-cad:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          ref: demo

      - name: Install FreeCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad curl unzip

      - name: Download committed CAD files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-validation
          base='https://raw.githubusercontent.com/samanramezani1377-hub/3D/demo/output/original-quadcopter-mesh-cad/downloaded-cad'
          for f in quadcopter_tidy_mesh_cad.FCStd quadcopter_tidy_mesh_cad.step quadcopter_tidy_solid_candidate.step; do
            curl --fail --location --retry 3 "$base/$f" -o "/tmp/cad-validation/$f"
            test -s "/tmp/cad-validation/$f"
            echo "$f: $(stat -c '%s bytes' "/tmp/cad-validation/$f")"
          done

      - name: Validate file containers and STEP headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/cad-validation')
          for name in ('quadcopter_tidy_mesh_cad.step','quadcopter_tidy_solid_candidate.step'):
              p=root/name
              head=p.read_bytes()[:8192]
              assert b'ISO-10303-21' in head and b'HEADER;' in head and b'FILE_SCHEMA' in head, f'{name}: invalid STEP header'
              print(name + ': STEP Part 21 header OK')
          p=root/'quadcopter_tidy_mesh_cad.FCStd'
          assert p.read_bytes()[:4] == b'PK\x03\x04', 'FCStd is not a ZIP-based FreeCAD document'
          import zipfile
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              assert bad is None, f'FCStd archive corruption: {bad}'
              print('FCStd internal archive OK; entries:', len(z.namelist()))
          PY

      - name: Import and inspect geometry in FreeCAD
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cad-validation/validate.FCMacro <<'PY'
          import os, json, traceback
          import FreeCAD as App
          import Part
          root='/tmp/cad-validation'
          report={'files':{},'errors':[]}
          try:
              doc=App.openDocument(os.path.join(root,'quadcopter_tidy_mesh_cad.FCStd'))
              report['files']['quadcopter_tidy_mesh_cad.FCStd']={'opened':True,'objects':[],'shapes':[]}
              for obj in doc.Objects:
                  report['files']['quadcopter_tidy_mesh_cad.FCStd']['objects'].append({'name':obj.Name,'type':obj.TypeId})
                  if hasattr(obj,'Shape') and not obj.Shape.isNull():
                      s=obj.Shape
                      report['files']['quadcopter_tidy_mesh_cad.FCStd']['shapes'].append({'name':obj.Name,'valid':bool(s.isValid()),'faces':len(s.Faces),'solids':len(s.Solids),'closed':bool(s.isClosed()),'volume':float(s.Volume),'bounds_mm':[float(s.BoundBox.XLength),float(s.BoundBox.YLength),float(s.BoundBox.ZLength)]})
              App.closeDocument(doc.Name)
              if not report['files']['quadcopter_tidy_mesh_cad.FCStd']['objects']:
                  raise RuntimeError('FCStd opened but contains no objects')
              for name in ('quadcopter_tidy_mesh_cad.step','quadcopter_tidy_solid_candidate.step'):
                  shape=Part.Shape()
                  shape.read(os.path.join(root,name))
                  if shape.isNull(): raise RuntimeError(name+' imported as null shape')
                  info={'valid':bool(shape.isValid()),'faces':len(shape.Faces),'solids':len(shape.Solids),'shells':len(shape.Shells),'closed':bool(shape.isClosed()),'volume':float(shape.Volume),'bounds_mm':[float(shape.BoundBox.XLength),float(shape.BoundBox.YLength),float(shape.BoundBox.ZLength)]}
                  report['files'][name]=info
                  if not shape.isValid(): raise RuntimeError(name+' imported but shape is invalid')
                  if not shape.Faces: raise RuntimeError(name+' contains no faces')
              with open(os.path.join(root,'validation-report.json'),'w') as f: json.dump(report,f,indent=2)
              print(json.dumps(report,indent=2))
          except Exception as e:
              report['errors'].append(str(e))
              traceback.print_exc()
              with open(os.path.join(root,'validation-report.json'),'w') as f: json.dump(report,f,indent=2)
              raise
          PY
          FC=''
          for candidate in FreeCADCmd freecadcmd /usr/lib/freecad/bin/FreeCADCmd /usr/lib/freecad/FreeCADCmd; do
            if command -v "$candidate" >/dev/null 2>&1; then FC="$(command -v "$candidate")"; break; fi
            if [ -x "$candidate" ]; then FC="$candidate"; break; fi
          done
          if [ -z "$FC" ]; then echo 'FreeCADCmd executable not found' >&2; find /usr -iname '*freecad*cmd*' -type f 2>/dev/null | head -20; exit 1; fi
          echo "Using FreeCAD command: $FC"
          env -u LD_LIBRARY_PATH "$FC" /tmp/cad-validation/validate.FCMacro

      - name: Publish validation report to demo
        if: success()
        run: |
          set -euo pipefail
          cp /tmp/cad-validation/validation-report.json output/original-quadcopter-mesh-cad/downloaded-cad/validation-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/original-quadcopter-mesh-cad/downloaded-cad/validation-report.json
          if git diff --cached --quiet; then echo 'Validation report unchanged'; else git commit -m 'Add independent CAD validation report'; git push origin HEAD:demo; fi

      - name: Upload validation report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-validation-report
          path: /tmp/cad-validation/validation-report.json
          if-no-files-found: ignore
